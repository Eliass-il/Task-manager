[project]
name = "task-manager"
version = "0.1.0"
description = "Personal online task manager."
authors = [
    {name = "Eliass-il",email = "eliassmat.il@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.162.2,<0.163.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "pydantic (>=2.14.3,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.1.8,<3.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "psycopg[binary] (>=3.3.8,<4.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
