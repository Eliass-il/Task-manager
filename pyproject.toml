[project]
name = "task-manager"
version = "0.1.0"
description = "Personal online task manager."
authors = [
    {name = "Eliass-il",email = "eliassmat.il@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.162.2,<0.163.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "pydantic[email] (>=2.14.3,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.1.8,<3.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "psycopg[binary] (>=3.3.8,<4.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.4.1.post1,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pwdlib[argon2] (>=0.4.2,<0.5.0)"
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
